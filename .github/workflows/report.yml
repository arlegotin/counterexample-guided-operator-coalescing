name: Report integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.9'
      - name: Install report-only dependencies
        run: python -m pip install -e '.[test,report]' 'PyYAML==6.0.3' 'pytest==9.1.1'
      - name: Test reporting integrity
        run: python -m pytest tests/test_report.py -q
      - name: Regenerate public report
        run: python -m poc report --include-failures
      - name: Check generated evidence is current
        run: git diff --exit-code -- REPORT.md results/summary.json results/regressions.parquet artifacts/release_manifest.json
